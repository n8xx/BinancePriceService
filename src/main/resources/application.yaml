spring:
  application:
    name: binance-price-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/binance_info}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

binance:
  api:
    base-url: ${BINANCE_API_BASE_URL:https://api.binance.com}
    symbol: ${BINANCE_SYMBOL:BNBUSDT}
    connect-timeout: PT5S
    read-timeout: PT10S
    poll-interval: ${BINANCE_POLL_INTERVAL:PT30S}


