databaseChangeLog:
  - changeSet:
      id: 001-create-symbol-prices
      author: natalia baraukova
      changes:
        - createTable:
            tableName: symbol_prices
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_symbol_prices
                    nullable: false
              - column:
                  name: symbol
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(20, 8)
                  constraints:
                    nullable: false
              - column:
                  name: binance_close_time
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: fetched_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: symbol_prices
            columnNames: symbol, binance_close_time
            constraintName: uq_symbol_prices_symbol_binance_close_time
        - createIndex:
            indexName: idx_symbol_prices_symbol_fetched_at
            tableName: symbol_prices
            columns:
              - column:
                  name: symbol
              - column:
                  name: fetched_at